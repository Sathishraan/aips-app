workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS IPA
        script: |
          WORKSPACE=$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$(find "$CM_BUILD_DIR/ios" -maxdepth 1 -name "*.xcodeproj" | head -n 1)" .xcodeproj)

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log