
workflows:
  ios-unsigned-build:
    name: Sparkle iOS Unsigned Build

    max_build_duration: 60

    instance_type: mac_mini_m2

    environment:
      node: 22.13.1

      vars:
        EXPO_PUBLIC_API_BASE_URL: "https://tigerservers.in/aips/"
        EXPO_PUBLIC_NODE_URL: "https://tigerservers.in/node_server/"

    scripts:

      - name: Install dependencies
        script: |
          npm ci

      - name: Check Expo project
        script: |
          npx expo-doctor

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build unsigned iOS archive
        script: |
          set -e

          cd ios

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)

          SCHEME=$(basename "$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)" .xcodeproj)

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/Sparkle.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

    artifacts:
      - build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log